        .typewriter {
            display: block;
            overflow: hidden;
            white-space: normal;
            word-wrap: break-word;
        }
        .typewriter::after {
            content: "";
            display: inline-block;
            width: 2px;
            height: 1.1em;
            margin-left: .35rem;
            background: rgba(255,255,255,.85);
            animation: blink-caret 0.75s step-end infinite;
            vertical-align: bottom;
        }
        @keyframes blink-caret {
            50% { background-color: transparent; }
        }
    </style>

    <script>
        const typeText = 'Soy un aprendiz de programacion en formacion, me apasiona el desarrollo web, tanto en el backend como en el frontend me desempeño bien. Estas son algunas tecnologias que conozco:';
        const target = document.getElementById('typewriter-text');
        let idx = 0;
        let typingTimeout;
        let resetTimeout;

        function typeWriter() {
            if (!target) return;
            target.textContent = typeText.slice(0, idx);
            idx++;
            if (idx <= typeText.length) {
                typingTimeout = setTimeout(typeWriter, 35);
            } else {
                resetTimeout = setTimeout(resetTypewriter, 10000);
            }
        }

        function resetTypewriter() {
            if (!target) return;
            clearTimeout(typingTimeout);
            idx = 0;
            target.textContent = '';
            typeWriter();
        }

        typeWriter();
    </script>
